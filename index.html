<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Watch – solar system &amp; satellite tracker</title>
<style>
:root{--bg:#04070d;--panel:#0d1522;--line:#1e2b42;--tx:#dbe6f5;--mut:#7f93b2;--sat:#5cc8ff;--sel:#ffb347;--ok:#5be3a0;--warn:#ffd166;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:grab}
#bar{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
select,input,button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input{width:210px}button{cursor:pointer}
button:hover,select:hover{border-color:var(--sat)}
:focus-visible{outline:2px solid var(--sat);outline-offset:2px}
.chip{color:var(--mut);background:rgba(13,21,34,.85);padding:6px 10px;border-radius:8px}
#glb{display:none;border-color:var(--sel)}
#res{position:fixed;top:56px;left:12px;width:330px;max-width:calc(100% - 24px);max-height:55vh;overflow:auto;background:rgba(13,21,34,.97);border:1px solid var(--line);border-radius:10px;display:none}
#res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0}
#res small{display:block}
#info{position:fixed;top:64px;right:12px;width:340px;max-width:calc(100% - 24px);max-height:calc(100% - 80px);overflow:auto;background:rgba(13,21,34,.94);border:1px solid var(--line);border-radius:12px;padding:16px;display:none}
#info h2{margin:0 24px 2px 0;font-size:19px}
.sub{color:var(--mut);margin-bottom:10px}
#x{position:absolute;top:8px;right:8px;padding:2px 9px}
dl{margin:0;display:grid;grid-template-columns:104px 1fr;gap:5px 10px}
dt{color:var(--mut)}dd{margin:0;word-break:break-word}
h3{font-size:13px;margin:14px 0 6px;color:var(--sel)}
.v{padding:6px 0;border-top:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
a{color:var(--sat)}
#info a.b{display:inline-block;margin:4px 6px 0 0;padding:5px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none}
small{color:var(--mut)}
#dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
#dock button{padding:5px 10px;background:rgba(13,21,34,.85)}
.lb{position:fixed;left:0;top:0;pointer-events:none;color:#cfe0ff;font-size:12px;text-shadow:0 0 4px #000;display:none;white-space:nowrap}
#cr{position:fixed;bottom:2px;right:8px;font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<div id="bar">
  <select id="go" aria-label="Go to"></select>
  <select id="grp" aria-label="Satellite group">
    <optgroup label="Working satellites (Earth)">
      <option value="stations">Space stations</option>
      <option value="visual" selected>Brightest (visible)</option>
      <option value="weather">Weather</option>
      <option value="gps-ops">GPS</option>
      <option value="galileo">Galileo</option>
      <option value="beidou">BeiDou</option>
      <option value="science">Science</option>
      <option value="geo">Geostationary</option>
      <option value="starlink">Starlink</option>
      <option value="active">All active (heavy)</option>
    </optgroup>
    <optgroup label="Non-functioning &amp; debris">
      <option value="cosmos-2251-debris">Cosmos 2251 debris</option>
      <option value="iridium-33-debris">Iridium 33 debris</option>
      <option value="fengyun-1c-debris">Fengyun 1C debris</option>
      <option value="cosmos-1408-debris">Cosmos 1408 debris</option>
      <option value="debris">All debris (heavy)</option>
    </optgroup>
    <optgroup label="Everything"><option value="everything">Active + debris (heaviest)</option></optgroup>
  </select>
  <input id="q" placeholder="Search name · NORAD ID + Enter" aria-label="Search">
  <button id="rot">Auto-rotate: on</button>
  <button id="glb">Globe view</button>
  <span class="chip" id="stat">Loading…</span>
  <span class="chip" id="sun">Sun: …</span>
</div>
<div id="res"></div><div id="labels"></div><div id="dock"></div><div id="cr">Textures © Solar System Scope (CC BY 4.0) · Orbits: NASA/JPL · Satellites: CelesTrak</div>
<aside id="info" aria-live="polite"><button id="x" aria-label="Close">×</button><div id="ib"></div></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.3/satellite.min.js"></script>
<script src="app.js"></script>
</body>
</html>
